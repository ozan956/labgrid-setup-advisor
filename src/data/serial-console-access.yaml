schemaVersion: 1
id: serial-console-access
title: Serial Console Access
description: Choose a local or distributed serial-console path and generate the matching Labgrid configuration.

questions:
  - id: serial-hardware
    text: How do you connect to the board to see startup messages?
    help: Choose the cable or network address you already use. If you have never opened the console, choose "I am not sure yet."
    options:
      - value: usb-adapter
        label: A USB cable or USB-to-UART adapter
        description: Linux shows the connection as a serial device such as /dev/ttyUSB0 or /dev/ttyACM0.
      - value: network-server
        label: A hostname or IP address and TCP port
        description: Someone gave you an address such as console.example.org:7001.
      - value: unknown
        label: I am not sure yet
        description: Help me identify the connection without guessing about its wiring or voltage.

  - id: network-protocol
    text: Which protocol does the network serial server use?
    help: Use the value from the serial-server configuration or ask its administrator. Raw TCP and RFC2217 are not interchangeable.
    visibleWhen:
      all:
        - question: serial-hardware
          equals: network-server
    options:
      - value: raw
        label: Raw TCP
        description: The server provides a plain TCP byte stream.
      - value: rfc2217
        label: RFC2217
        description: The server supports serial-port control through RFC2217.
      - value: unknown
        label: I do not know
        description: I need to check the server configuration or ask its administrator.

  - id: location
    text: Which Linux computer will directly open the serial connection?
    help: Choose the computer with the USB cable attached, or the computer that will connect to the network serial server. It may be different from the computer where you are reading this page.
    visibleWhen:
      any:
        - question: serial-hardware
          equals: usb-adapter
        - question: serial-hardware
          equals: network-server
    options:
      - value: local
        label: The computer where I will run Labgrid
        description: The USB cable is attached here, or this computer can reach the network serial server directly.
      - value: remote
        label: A different Linux computer beside the board
        description: That computer will open the serial connection and share it through Labgrid.

recommendations:
  - id: identify-serial-interface
    category: warning
    title: Identify the serial connection before configuring Labgrid
    summary: Check the board manual or ask whoever wired the board whether the console uses a USB adapter or a network serial server.
    when:
      all:
        - question: serial-hardware
          equals: unknown
    why:
      - Labgrid needs to know how the console is physically reached before it can select a safe resource.
      - UART voltage and pinout must match the board; software cannot determine that safely.
    nextSteps:
      - Note the exact board model and revision, then open its official serial or UART documentation.
      - Before attaching bare UART pins, confirm the connector pinout, I/O voltage, and a common ground.
      - If a USB connection is attached to Linux, run labgrid-suggest and look for a USBSerialPort suggestion.
      - Return with the connection type and the console baud rate from the board documentation.
    requirements:
      hardware:
        - The board manual or wiring information for its serial console.
      software:
        - Run labgrid-suggest if a USB serial adapter is connected to the Linux host.
    components: []
    architecture: []
    commands:
      - command: labgrid-suggest
        description: List USB devices Labgrid may be able to describe.
    documentation: [suggest]

  - id: check-network-protocol
    category: warning
    title: Confirm the network serial protocol before configuring Labgrid
    summary: 'Ask the serial-server administrator whether the endpoint uses raw TCP or RFC2217. Do not guess: the two protocols are not interchangeable.'
    when:
      all:
        - question: serial-hardware
          equals: network-server
        - question: network-protocol
          equals: unknown
    why:
      - Labgrid must use the same protocol as the serial server to open the console correctly.
      - A hostname and port alone do not identify whether the endpoint is raw TCP or RFC2217.
    nextSteps:
      - Check the serial-server configuration or ask its administrator for the protocol name.
      - Also collect the endpoint hostname, TCP port, and board console baud rate.
      - Return and select Raw TCP or RFC2217 before copying a configuration template.
    requirements:
      hardware: []
      software:
        - Access to the serial-server configuration or its administrator.
    components: []
    architecture: []
    commands: []
    documentation: [configuration]

  - id: check-usb-uart-safety
    category: warning
    title: Check the electrical connection before using bare UART pins
    summary: An adapter that fits can still use the wrong electrical standard or voltage. TTL UART and RS-232 are not interchangeable.
    when:
      all:
        - question: serial-hardware
          equals: usb-adapter
    why:
      - A voltage or pinout mismatch can damage the adapter or board.
      - A board with a built-in USB serial connector does not need separate bare-pin UART wiring.
    nextSteps:
      - If you use the board's built-in USB serial connector, follow the board manual for that connector.
      - If you use bare UART pins, confirm the board I/O voltage, adapter voltage, TX/RX pinout, and common ground before connecting it.
      - Do not connect an RS-232 adapter to TTL UART pins unless the board documentation explicitly requires RS-232 levels.
    requirements:
      hardware:
        - The exact board and adapter documentation when using bare UART pins.
      software: []
    components: []
    architecture: []
    commands: []
    documentation: [configuration]

  - id: usb-serial
    category: approach
    title: Use the USB-to-serial adapter
    summary: Identify the adapter by its stable hardware information so Linux device-number changes do not break the console.
    when:
      all:
        - question: serial-hardware
          equals: usb-adapter
    why:
      - USBSerialPort follows the adapter through udev and supplies SerialDriver with its current device node.
      - The exporter translates it to NetworkSerialPort for remote clients.
    nextSteps:
      - Find the console baud rate in the board documentation and complete the electrical check for any bare UART wiring.
      - Connect the USB cable or adapter to the Linux computer that will handle the console.
      - Run labgrid-suggest on that computer and note its stable ID_SERIAL_SHORT or ID_PATH.
      - Replace every placeholder in the generated template before opening the console.
    requirements:
      hardware:
        - A correctly wired UART adapter with voltage levels compatible with the target.
      software:
        - Labgrid and pyserial on the host using the adapter.
        - ser2net on an exporter host for remote serial access.
    components:
      - kind: resource
        name: USBSerialPort / NetworkSerialPort
        reason: Identifies the local USB adapter and its exported network representation.
      - kind: driver
        name: SerialDriver
        reason: Implements ConsoleProtocol over the selected serial resource.
    architecture:
      - label: Labgrid client
        detail: Opens the console through SerialDriver.
      - label: Serial adapter
        detail: Converts USB to the board's electrically compatible UART.
      - label: Target UART
        detail: Exposes boot and runtime console traffic.
    commands:
      - command: labgrid-suggest
        description: Discover a stable ID_SERIAL_SHORT or ID_PATH for the adapter.
    documentation: [configuration, suggest]

  - id: network-serial
    category: approach
    title: Connect to the existing network serial console
    summary: Enter the serial server's address, port, speed, and protocol so Labgrid can open the console.
    when:
      all:
        - question: serial-hardware
          equals: network-server
        - question: network-protocol
          in: [raw, rfc2217]
    why:
      - NetworkSerialPort is the upstream resource for raw TCP and RFC2217 serial endpoints.
      - SerialDriver applies the configured line speed and opens the network connection.
    nextSteps:
      - Collect the server hostname or IP address, TCP port, protocol, and board console baud rate.
      - Verify that the selected Linux computer can reach the endpoint.
      - Replace every placeholder in the generated template before opening the console.
    requirements:
      hardware:
        - A serial server connected with the correct UART voltage, pinout, and flow-control settings.
      software:
        - Network reachability from the Labgrid client or exporter.
    components:
      - kind: resource
        name: NetworkSerialPort
        reason: Stores the endpoint host, port, speed, and protocol.
      - kind: driver
        name: SerialDriver
        reason: Implements ConsoleProtocol for the network endpoint.
    architecture:
      - label: Labgrid client
        detail: Connects using raw TCP or RFC2217.
      - label: Serial server
        detail: Bridges the network connection to the target UART.
      - label: Target UART
        detail: Carries the console stream.
    commands: []
    documentation: [configuration]

  - id: local-console
    category: topology
    title: Run the console from this computer
    summary: One local configuration is enough when this computer reaches the console and nobody else needs to reserve it.
    when:
      all:
        - question: location
          equals: local
    why:
      - Local resources can be declared directly in the target environment.
    nextSteps:
      - Save the generated environment template as environment.yaml.
      - Replace every marked placeholder with a value verified for your hardware.
      - Run labgrid-client -c environment.yaml console to open the configured console.
    requirements:
      hardware: []
      software:
        - microcom is useful for interactive labgrid-client console access.
    components:
      - kind: infrastructure
        name: Local environment file
        reason: Defines the serial resource and driver on one machine.
    architecture: []
    commands:
      - command: labgrid-client -c environment.yaml console
        description: Open the configured console interactively.
    documentation: [client]

  - id: remote-console
    category: topology
    title: Share the console safely over the lab network
    summary: Run Labgrid beside the console connection and require users to reserve the board before opening it.
    when:
      all:
        - question: location
          equals: remote
    why:
      - The coordinator provides discovery and exclusive acquisition while the exporter exposes the hardware-side console.
    nextSteps:
      - Follow the distributed infrastructure tutorial to start a coordinator and an exporter on the hardware-side Linux computer.
      - Publish the serial resource with exporter.yaml and map it to a coordinator place.
      - Acquire the place before opening the console, then release it when finished.
    requirements:
      hardware:
        - A Linux exporter host with access to the serial interface.
      software:
        - labgrid-exporter, labgrid-coordinator, ser2net, and passwordless SSH where required.
    components:
      - kind: infrastructure
        name: labgrid-exporter and labgrid-coordinator
        reason: Publish the resource and control exclusive access.
      - kind: resource
        name: RemotePlace
        reason: Expands the acquired place into its exported serial resource.
    architecture:
      - label: Developer
        detail: Acquires a place and requests the console.
      - label: Coordinator
        detail: Allocates the matching place.
      - label: Exporter
        detail: Publishes the serial resource beside the hardware.
    commands:
      - command: labgrid-client -p <PLACE_NAME> acquire
        description: Acquire exclusive access before opening the console.
      - command: labgrid-client -p <PLACE_NAME> console
        description: Connect to the exported serial console.
      - command: labgrid-client -p <PLACE_NAME> release
        description: Release the place when finished.
    documentation: [getting-started, client, exporter]

configurations:
  - id: local-usb-serial
    title: Local USB serial environment
    filename: environment.yaml
    kind: environment
    when:
      all:
        - question: serial-hardware
          equals: usb-adapter
        - question: location
          equals: local
    template: |
      targets:
        main:
          resources:
            USBSerialPort:
              match:
                ID_SERIAL_SHORT: '{{SERIAL_NUMBER}}'
              speed: {{BAUD_RATE}}
          drivers:
            SerialDriver: {}
    placeholders:
      - token: SERIAL_NUMBER
        label: Adapter serial number
        description: Stable ID_SERIAL_SHORT reported by udev or labgrid-suggest.
        example: FT123456
        required: true
      - token: BAUD_RATE
        label: Baud rate
        description: UART speed required by the board console.
        example: '115200'
        required: true

  - id: local-network-serial
    title: Local network serial environment
    filename: environment.yaml
    kind: environment
    when:
      all:
        - question: serial-hardware
          equals: network-server
        - question: network-protocol
          in: [raw, rfc2217]
        - question: location
          equals: local
    template: |
      targets:
        main:
          resources:
            NetworkSerialPort:
              host: '{{SERIAL_HOST}}'
              port: {{SERIAL_PORT}}
              speed: {{BAUD_RATE}}
              protocol: '{{answer:network-protocol}}'
          drivers:
            SerialDriver: {}
    placeholders:
      - token: SERIAL_HOST
        label: Serial server host
        description: DNS name or address reachable by the client.
        example: console.example.org
        required: true
      - token: SERIAL_PORT
        label: TCP port
        description: Port exposed by the serial server.
        example: '7001'
        required: true
      - token: BAUD_RATE
        label: Baud rate
        description: UART speed required by the board console.
        example: '115200'
        required: true

  - id: remote-usb-serial-exporter
    title: USB serial exporter resources
    filename: exporter.yaml
    kind: exporter
    when:
      all:
        - question: serial-hardware
          equals: usb-adapter
        - question: location
          equals: remote
    template: |
      {{EXPORT_GROUP}}:
        USBSerialPort:
          match:
            ID_SERIAL_SHORT: '{{SERIAL_NUMBER}}'
          speed: {{BAUD_RATE}}
    placeholders:
      - token: EXPORT_GROUP
        label: Exporter group
        description: Stable group name for this board.
        example: board-01
        required: true
      - token: SERIAL_NUMBER
        label: Adapter serial number
        description: Stable ID_SERIAL_SHORT visible on the exporter host.
        example: FT123456
        required: true
      - token: BAUD_RATE
        label: Baud rate
        description: UART speed required by the board console.
        example: '115200'
        required: true

  - id: remote-network-serial-exporter
    title: Network serial exporter resources
    filename: exporter.yaml
    kind: exporter
    when:
      all:
        - question: serial-hardware
          equals: network-server
        - question: network-protocol
          in: [raw, rfc2217]
        - question: location
          equals: remote
    template: |
      {{EXPORT_GROUP}}:
        NetworkSerialPort:
          host: '{{SERIAL_HOST}}'
          port: {{SERIAL_PORT}}
          speed: {{BAUD_RATE}}
          protocol: '{{answer:network-protocol}}'
    placeholders:
      - token: EXPORT_GROUP
        label: Exporter group
        description: Stable group name for this board.
        example: board-01
        required: true
      - token: SERIAL_HOST
        label: Serial server host
        description: Address reachable by the exporter and clients according to site routing.
        example: console.example.org
        required: true
      - token: SERIAL_PORT
        label: TCP port
        description: Port exposed by the serial server.
        example: '7001'
        required: true
      - token: BAUD_RATE
        label: Baud rate
        description: UART speed required by the board console.
        example: '115200'
        required: true

  - id: remote-serial-client
    title: Remote console client environment
    filename: remote.yaml
    kind: environment
    when:
      all:
        - question: location
          equals: remote
      any:
        - question: serial-hardware
          equals: usb-adapter
        - question: network-protocol
          in: [raw, rfc2217]
    template: |
      targets:
        main:
          resources:
            RemotePlace:
              name: '{{PLACE_NAME}}'
          drivers:
            SerialDriver: {}
    placeholders:
      - token: PLACE_NAME
        label: Coordinator place
        description: Place matched to the exported serial resource.
        example: board-01
        required: true

documentation:
  - id: configuration
    title: Serial resources and SerialDriver
    url: https://labgrid.readthedocs.io/en/latest/configuration.html
  - id: suggest
    title: labgrid-suggest manual
    url: https://labgrid.readthedocs.io/en/latest/man/suggest.html
  - id: getting-started
    title: Distributed infrastructure tutorial
    url: https://labgrid.readthedocs.io/en/latest/getting_started.html
  - id: client
    title: labgrid-client manual
    url: https://labgrid.readthedocs.io/en/latest/man/client.html
  - id: exporter
    title: labgrid-exporter manual
    url: https://labgrid.readthedocs.io/en/latest/man/exporter.html
