schemaVersion: 1
id: ci-integration
title: CI Integration
description: Run CI work on hardware already published through a Labgrid coordinator, then release it reliably.

questions:
  - id: allocation
    text: Does the job need one exact board or any compatible board?
    help: Use one exact board for a simple setup. Use a compatible pool when several equivalent boards are available.
    options:
      - value: fixed-place
        label: Always the same board
        description: The job always targets a known board such as board-01.
      - value: tagged-pool
        label: Any compatible free board
        description: Labgrid finds an available board using labels such as model or capability.

  - id: workload
    text: What will the job run?
    help: Choose a full pytest suite or one small serial-console smoke action.
    options:
      - value: pytest
        label: A pytest hardware suite
        description: Run repeatable Python tests that use Labgrid's pytest integration.
      - value: client-command
        label: A serial-console smoke command
        description: Open or check the exported serial console with labgrid-client.

recommendations:
  - id: fixed-ci-place
    category: approach
    title: Reserve the same board for every job
    summary: Give the board a stable name, reserve it when the job starts, and release it even when the job fails.
    nextSteps:
      - From the CI runner, use labgrid-client places to confirm that the named board is visible.
      - Acquire and release that place manually once before adding the commands to the pipeline.
    when:
      all:
        - question: allocation
          equals: fixed-place
    why:
      - A named place is predictable and easy to diagnose.
      - Acquisition still prevents concurrent developers or jobs from using the board.
    requirements:
      hardware:
        - A board already published by an exporter and assigned to the named place.
      software:
        - Network access to the coordinator and exporter, plus credentials and SSH configuration required by the site.
    components:
      - kind: resource
        name: RemotePlace
        reason: Loads the resources assigned to the fixed coordinator place.
      - kind: infrastructure
        name: labgrid-coordinator
        reason: Enforces exclusive acquisition for the job.
    architecture:
      - label: CI job
        detail: Acquires the named place and runs the workload.
      - label: Coordinator
        detail: Rejects concurrent acquisition.
      - label: Exporter
        detail: Exposes the physical board resources.
    commands:
      - command: labgrid-client -p <PLACE_NAME> acquire
        description: Acquire the fixed place at job start.
      - command: labgrid-client -p <PLACE_NAME> release
        description: Release it in a finally or after-script step.
    documentation: [client, getting-started]

  - id: pooled-ci-place
    category: approach
    title: Let Labgrid find any compatible free board
    summary: Label equivalent boards by capability and wait until one can be reserved for the job.
    nextSteps:
      - Ask the lab operator for the exact coordinator tag that identifies compatible boards.
      - From the CI runner, reserve, acquire, release, and cancel one tagged reservation manually before automating it.
    when:
      all:
        - question: allocation
          equals: tagged-pool
    why:
      - Reservations queue jobs until any compatible place is free.
      - Tags decouple a pipeline from one physical serial number or rack slot.
    requirements:
      hardware:
        - Equivalent board places carrying a shared coordinator tag such as board=imx8.
      software:
        - A shell-capable CI runner that preserves LG_RESERVATION for acquire, workload, release, and cancellation.
    components:
      - kind: infrastructure
        name: Coordinator reservations
        reason: Select and hold one matching place for the CI owner.
      - kind: resource
        name: RemotePlace
        reason: Supplies the allocated place's resources to the workload.
    architecture:
      - label: CI scheduler
        detail: Starts a job that requests compatible hardware.
      - label: Coordinator reservation
        detail: Waits for and allocates one tagged place.
      - label: Exporter
        detail: Exposes the chosen board.
    commands:
      - command: eval "$(labgrid-client reserve --wait --shell board=<BOARD_TAG>)"
        description: Create a reservation and export LG_RESERVATION.
      - command: labgrid-client -p + acquire
        description: Acquire the place allocated to the reservation.
      - command: labgrid-client -p + release
        description: Release the allocated place during cleanup.
      - command: labgrid-client cancel-reservation
        description: Cancel the reservation after releasing the place.
    documentation: [reservations, client]

  - id: pytest-ci
    category: topology
    title: Run pytest after the board is reserved
    summary: Keep the Labgrid test configuration in the repository and start pytest only after the job has exclusive board access.
    nextSteps:
      - Add the generated CI environment to the repository and run one focused pytest job after acquisition.
      - Put release and reservation cancellation in the CI system's unconditional cleanup step.
    when:
      all:
        - question: workload
          equals: pytest
    why:
      - The pytest plugin loads the same drivers used interactively.
      - Separating allocation from tests makes failure and cleanup behavior visible in CI logs.
    requirements:
      hardware: []
      software:
        - Labgrid and the project's test dependencies installed in the CI image.
    components:
      - kind: infrastructure
        name: Labgrid pytest plugin
        reason: Provides configured targets to hardware tests.
    architecture: []
    commands:
      - command: pytest --lg-env ci.yaml
        description: Run the suite after acquiring the selected place.
    documentation: [pytest]

  - id: command-ci
    category: topology
    title: Run a serial-console smoke command
    summary: Use labgrid-client for a small console smoke check, while keeping acquisition and cleanup identical to a full test job.
    nextSteps:
      - Add the generated serial-console environment to the repository and test the console command after acquisition.
      - Put release and reservation cancellation in the CI system's unconditional cleanup step.
    when:
      all:
        - question: workload
          equals: client-command
    why:
      - A focused console command is useful for smoke checks before building a full pytest suite.
    requirements:
      hardware: []
      software:
        - A client environment containing RemotePlace and SerialDriver.
    components:
      - kind: infrastructure
        name: labgrid-client
        reason: Activates the configured driver for one command.
    architecture: []
    commands:
      - command: labgrid-client -c ci.yaml console
        description: Example smoke action supported by the generated serial-console environment.
    documentation: [client]

configurations:
  - id: fixed-ci-client
    title: Fixed-place CI environment
    filename: ci.yaml
    kind: environment
    when:
      all:
        - question: allocation
          equals: fixed-place
    template: |
      targets:
        main:
          resources:
            RemotePlace:
              name: '{{PLACE_NAME}}'
          drivers:
            SerialDriver: {}
    placeholders:
      - token: PLACE_NAME
        label: Coordinator place
        description: Existing place whose exported resources include a serial console.
        example: board-01
        required: true

  - id: pooled-ci-client
    title: Reserved-place CI environment
    filename: ci.yaml
    kind: environment
    when:
      all:
        - question: allocation
          equals: tagged-pool
    template: |
      targets:
        main:
          resources:
            RemotePlace:
              name: '{{ALLOCATED_PLACE}}'
          drivers:
            SerialDriver: {}
    placeholders:
      - token: ALLOCATED_PLACE
        label: Allocated place
        description: Concrete place returned by the reservation; generate or template this value in the CI job.
        example: board-01
        required: true

documentation:
  - id: client
    title: labgrid-client manual
    url: https://labgrid.readthedocs.io/en/latest/man/client.html
  - id: getting-started
    title: Distributed infrastructure tutorial
    url: https://labgrid.readthedocs.io/en/latest/getting_started.html
  - id: reservations
    title: Places, tags, and reservations
    url: https://labgrid.readthedocs.io/en/latest/usage.html
  - id: pytest
    title: Labgrid pytest integration
    url: https://labgrid.readthedocs.io/en/latest/usage.html
