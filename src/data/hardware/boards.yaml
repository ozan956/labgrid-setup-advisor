  - id: nordic-nrf52840-dk
    name: Nordic nRF52840 DK
    vendor: Nordic Semiconductor
    family: nrf52
    verification: docs
    console:
      interface: cdc-acm
      speed: 115200
      chip: jlink
      note: The on-board SEGGER J-Link OB (1366:1015) exposes a CDC ACM port wired to the nRF52840 UART (/dev/ttyACM*). That id is not in Labgrid's USBDebugger match list at v26.0-281, so use the console as a USBSerialPort and run OpenOCD or nrfjprog from a script.
    power:
      inputs: [micro-usb]
      note: Powered from the J-Link micro-USB connector (or a coin cell); a YKUSH or switchable hub port can power-cycle it.
    flashing: [openocd]
    bootloader:
      kind: none
      note: OpenOCD uses interface/jlink.cfg with target/nordic/nrf52.cfg (board/nordic/nrf52-dk.cfg); nrfjprog and pyOCD are alternatives.
    tags: [cortex-m, mcu, ble, evk]
    docs:
      - title: nRF52840 DK
        url: https://www.nordicsemi.com/Products/Development-hardware/nRF52840-DK
    sources:
      - 'openocd: tcl/board/nordic/nrf52-dk.cfg'
  - id: espressif-esp32-s3-devkitc-1
    name: Espressif ESP32-S3-DevKitC-1
    vendor: Espressif
    family: esp32
    verification: docs
    console:
      interface: onboard-usb
      speed: 115200
      chip: cp210x
      note: Two micro-USB connectors; the UART port has a CP2102N bridge (10c4:ea60, /dev/ttyUSB*) and the USB port is the chip's built-in USB Serial/JTAG (303a:1001, /dev/ttyACM*), which OpenOCD uses through board/esp32s3-builtin.cfg.
    power:
      inputs: [micro-usb]
      note: 5 V over either micro-USB connector; a YKUSH or switchable hub port can power-cycle it.
    flashing: [openocd]
    bootloader:
      kind: none
      note: Flashing normally uses esptool over the UART port through the automatic boot-mode circuit; wrap it in a FlashScriptDriver. OpenOCD over the built-in USB JTAG is the alternative.
    tags: [mcu, wifi, evk]
    docs:
      - title: ESP32-S3-DevKitC-1 user guide
        url: https://docs.espressif.com/projects/esp-idf/en/latest/esp32s3/hw-reference/esp32s3/user-guide-devkitc-1.html
    sources:
      - 'openocd: tcl/board/esp32s3-builtin.cfg'
