      - 'linux: arch/arm64/boot/dts/rockchip/rk3588-rock-5b.dts'
      - 'linux: arch/arm64/boot/dts/rockchip/rk3588-rock-5b-5bp-5t.dtsi'
      - 'buildroot: configs/rock5b_defconfig'
