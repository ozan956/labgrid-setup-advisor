# USB device catalog for the bench profile detector.
#
# Each entry maps one vendor id plus one or more product ids to the Labgrid
# resource family the device usually represents. Ids are lower-case 4-digit
# hex, exactly as printed by `lsusb` and udev's ID_VENDOR_ID / ID_MODEL_ID.
# Product names follow the usb.ids database where it has an entry; otherwise
# the note says where the id comes from. Keep claims conservative.
schemaVersion: 1
devices:
  # ---------------------------------------------------------------- FTDI
  - vendorId: '0403'
    productIds: ['6001']
    vendor: FTDI
    product: FT232R USB-UART
    class: usb-serial
    chip: ftdi
    serialNumber: usually-unique
    notes:
      - Genuine FT232R adapters carry a unique serial number, so ID_SERIAL_SHORT is a stable match.
      - Clone adapters often share one serial number or report none; fall back to ID_PATH (the tty device's own USB port path, as labgrid-suggest prints it) in that case.
  - vendorId: '0403'
    productIds: ['6015']
    vendor: FTDI
    product: FT231X / FT234X USB-UART
    class: usb-serial
    chip: ftdi
    serialNumber: usually-unique
    notes:
      - Common on-board console chip; the usb.ids database lists it generically as an FTDI bridge.
  - vendorId: '0403'
    productIds: ['6010']
    vendor: FTDI
    product: FT2232C/D/H dual UART/FIFO
    class: usb-serial
    chip: ftdi
    serialNumber: usually-unique
    multiInterface: true
    notes:
      - Exposes two interfaces, so add ID_USB_INTERFACE_NUM ('00' or '01') to the match when matching by serial number.
      - This id is also on Labgrid's USBDebugger list because many JTAG probes are FT2232-based; if you use channel A for JTAG, only channel B is a console.
  - vendorId: '0403'
    productIds: ['6011']
    vendor: FTDI
    product: FT4232H quad UART/FIFO
    class: usb-serial
    chip: ftdi
    serialNumber: usually-unique
    multiInterface: true
    notes:
      - Exposes four interfaces ('00' to '03'); many evaluation boards route the console to one of them, so add ID_USB_INTERFACE_NUM to the match.
  - vendorId: '0403'
    productIds: ['6014']
    vendor: FTDI
    product: FT232H single HS USB-UART/FIFO
    class: usb-serial
    chip: ftdi
    serialNumber: usually-unique
    notes:
      - Also on Labgrid's USBDebugger list; FT232H boards are frequently used as OpenOCD adapters in MPSSE mode instead of as a UART.

  # ---------------------------------------------------------------- Silicon Labs
  - vendorId: '10c4'
    productIds: ['ea60']
    vendor: Silicon Labs
    product: CP2102 / CP2104 UART bridge
    class: usb-serial
    chip: cp210x
    serialNumber: shared
    notes:
      - Many CP2102 modules ship with the serial number '0001', so two adapters on one host collide. Prefer the ID_PATH match unless `udevadm info` shows a customized serial.
  - vendorId: '10c4'
    productIds: ['ea70']
    vendor: Silicon Labs
    product: CP2105 dual UART bridge
    class: usb-serial
    chip: cp210x
    serialNumber: usually-unique
    multiInterface: true
    notes:
      - Two interfaces; add ID_USB_INTERFACE_NUM to pick the console channel.
  - vendorId: '10c4'
    productIds: ['ea71']
    vendor: Silicon Labs
    product: CP2108 quad UART bridge
    class: usb-serial
    chip: cp210x
    serialNumber: usually-unique
    multiInterface: true
    notes:
      - Four interfaces; add ID_USB_INTERFACE_NUM to pick the console channel.

  # ---------------------------------------------------------------- WCH
  - vendorId: '1a86'
    productIds: ['7523']
    vendor: QinHeng Electronics (WCH)
    product: CH340 / CH341 serial converter
    class: usb-serial
    chip: ch340
    serialNumber: none
    notes:
      - CH340 adapters have no USB serial number, so ID_SERIAL_SHORT does not exist. Match with ID_PATH and keep the adapter in the same USB port.
  - vendorId: '1a86'
    productIds: ['55d4']
    vendor: QinHeng Electronics (WCH)
    product: CH9102 serial converter
    class: usb-serial
    chip: ch340
    serialNumber: none
    notes:
      - Id per the Linux ch341 driver; not in the local usb.ids database.
      - Usually no unique serial number; match with ID_PATH.
  - vendorId: '1a86'
    productIds: ['55d3']
    vendor: QinHeng Electronics (WCH)
    product: CH343 serial converter
    class: usb-serial
    chip: ch340
    serialNumber: none
    notes:
      - Id per the Linux ch341/ch343 drivers; not in the local usb.ids database.
      - Usually no unique serial number; match with ID_PATH.

  # ---------------------------------------------------------------- Prolific
  - vendorId: '067b'
    productIds: ['2303']
    vendor: Prolific
    product: PL2303 serial port
    class: usb-serial
    chip: pl2303
    serialNumber: none
    notes:
      - PL2303 adapters normally have no serial number; match with ID_PATH.
      - Counterfeit PL2303 chips are rejected by Windows drivers but work on Linux.
  - vendorId: '067b'
    productIds: ['23a3']
    vendor: Prolific
    product: PL2303GC serial bridge
    class: usb-serial
    chip: pl2303
    serialNumber: none
    notes:
      - usb.ids lists this id as an ATEN serial bridge; Linux handles it with the pl2303 driver.
      - Normally no serial number; match with ID_PATH.

  # ---------------------------------------------------------------- STMicroelectronics
  - vendorId: '0483'
    productIds: ['3748']
    vendor: STMicroelectronics
    product: ST-LINK/V2
    class: usb-debugger
    chip: stlink
    serialNumber: unique
    openocdInterface: interface/stlink.cfg
    notes:
      - Stand-alone ST-LINK/V2 dongle without a virtual COM port.
  - vendorId: '0483'
    productIds: ['374b']
    vendor: STMicroelectronics
    product: ST-LINK/V2.1 (on Nucleo and Discovery boards)
    class: usb-debugger-with-serial
    chip: stlink
    serialNumber: unique
    openocdInterface: interface/stlink.cfg
    notes:
      - One USB cable provides the debugger and a CDC ACM virtual COM port (/dev/ttyACM*) wired to the target UART.
      - Use the same device for a USBDebugger and a USBSerialPort; match the serial port with ID_PATH or ID_SERIAL_SHORT plus ID_USB_INTERFACE_NUM.
  - vendorId: '0483'
    productIds: ['374e', '374f', '3754']
    vendor: STMicroelectronics
    product: STLINK-V3 family
    class: usb-debugger-with-serial
    chip: stlink
    serialNumber: unique
    openocdInterface: interface/stlink.cfg
    notes:
      - Most STLINK-V3 variants (V3SET, V3MINI, V3E) also expose a virtual COM port; check `lsusb -v` or `ls /dev/ttyACM*` to confirm on your board.
      - Ids 374e, 374f and 3754 are in Labgrid's USBDebugger whitelist; 3754 is not in the local usb.ids database.
  - vendorId: '0483'
    productIds: ['3753']
    vendor: STMicroelectronics
    product: STLINK-V3 variant (virtual COM port and mass storage)
    class: usb-serial
    chip: stlink
    serialNumber: unique
    notes:
      - This STLINK-V3 configuration is not in Labgrid's USBDebugger whitelist at v26.0-281, so only its virtual COM port is usable through Labgrid; switch the probe to a whitelisted configuration (374e, 374f, 3754) for OpenOCD.
  - vendorId: '0483'
    productIds: ['df11']
    vendor: STMicroelectronics
    product: STM32 device in DFU mode
    class: dfu
    chip: stm32
    serialNumber: unique
    notes:
      - The built-in system bootloader; use DFUDevice with DFUDriver and flash with dfu-util alt settings.

  # ---------------------------------------------------------------- SEGGER
  - vendorId: '1366'
    productIds: ['0101', '0102', '0103', '0104', '0105', '0107', '0108', '1015', '1051', '1061']
    vendor: SEGGER
    product: J-Link debug probe
    class: usb-debugger
    chip: jlink
    serialNumber: unique
    openocdInterface: interface/jlink.cfg
    notes:
      - Labgrid's USBDebugger matches 0101-0105, 0107, 0108, 1001-102f and 1050-106f (there is no 0106); only the common ids are listed here.
      - OpenOCD needs libjaylink support compiled in; the vendor J-Link software also works but is not driven by Labgrid.

  # ---------------------------------------------------------------- CMSIS-DAP probes
  - vendorId: '0d28'
    productIds: ['0204']
    vendor: Arm (DAPLink)
    product: DAPLink CMSIS-DAP probe
    class: usb-serial
    chip: daplink
    serialNumber: unique
    notes:
      - Found on Analog Devices MAX32xxx EVKITs, BBC micro:bit and many Cortex-M evaluation boards.
      - Provides a CDC ACM console (/dev/ttyACM*) and a mass-storage drag-and-drop volume next to the CMSIS-DAP debug interface (OpenOCD interface/cmsis-dap.cfg).
      - Labgrid's USBDebugger resource does not match this id at v26.0-281, so OpenOCD flashing through Labgrid needs an upstream whitelist change; the console still works as a USBSerialPort.
      - usb.ids lists this id as "NXP ARM mbed"; DAPLink is the firmware name.
  - vendorId: '2e8a'
    productIds: ['000c']
    vendor: Raspberry Pi
    product: Raspberry Pi Debug Probe
    class: usb-serial
    chip: daplink
    serialNumber: unique
    notes:
      - Id per the Raspberry Pi USB id registry; not in the local usb.ids database.
      - Provides CMSIS-DAP (OpenOCD interface/cmsis-dap.cfg) plus a UART bridge on a second interface.
      - Labgrid's USBDebugger resource does not match this id at v26.0-281, so OpenOCD flashing through Labgrid needs an upstream whitelist change; the console still works as a USBSerialPort.
  - vendorId: '2e8a'
    productIds: ['000a']
    vendor: Raspberry Pi
    product: Pico SDK CDC serial
    class: usb-serial
    chip: cdc-acm
    serialNumber: unique
    notes:
      - Id per the Raspberry Pi USB id registry; appears as /dev/ttyACM* when the firmware enables stdio over USB.
  - vendorId: '2e8a'
    productIds: ['0003']
    vendor: Raspberry Pi
    product: RP2040 BOOTSEL bootloader
    class: unsupported
    notes:
      - UF2 drag-and-drop or picotool flashing; Labgrid has no resource for it. Use a Debug Probe for automated flashing instead.
  - vendorId: '1d50'
    productIds: ['6018']
    vendor: 1BitSquared
    product: Black Magic Probe
    class: usb-serial
    chip: blackmagic
    serialNumber: unique
    notes:
      - Speaks the GDB remote protocol directly; OpenOCD is not the normal path, so Labgrid's OpenOCDDriver does not apply without extra tooling.
      - The second CDC ACM interface is a plain UART that works as a USBSerialPort; add ID_USB_INTERFACE_NUM to pick it.
      - Labgrid's USBDebugger resource does not match this id at v26.0-281, so OpenOCD flashing through Labgrid needs an upstream whitelist change; the console still works as a USBSerialPort.

  # ---------------------------------------------------------------- Espressif, Arduino
  - vendorId: '303a'
    productIds: ['1001']
    vendor: Espressif
    product: USB JTAG/serial debug unit (ESP32-S3, ESP32-C3, ESP32-C6)
    class: usb-serial
    chip: cdc-acm
    serialNumber: unique
    notes:
      - Id per the Espressif documentation; not in the local usb.ids database.
      - The same device also exposes the built-in JTAG, which OpenOCD for ESP32 supports; upstream OpenOCD support varies.
  - vendorId: '2341'
    productIds: ['0043']
    vendor: Arduino
    product: Uno R3 (CDC ACM)
    class: usb-serial
    chip: cdc-acm
    serialNumber: unique
  - vendorId: '2341'
    productIds: ['0042']
    vendor: Arduino
    product: Mega 2560 R3 (CDC ACM)
    class: usb-serial
    chip: cdc-acm
    serialNumber: unique

  # ---------------------------------------------------------------- Power switching
  - vendorId: '04d8'
    productIds: ['f2f7']
    vendor: Yepkit
    product: YKUSH 3-port switchable hub
    class: ykush
    serialNumber: unique
    notes:
      - Controlled by `ykushcmd`; list serials with `ykushcmd -l`. Ports are 1 to 3, or 'a' for all.
  - vendorId: '04d8'
    productIds: ['f0cd']
    vendor: Yepkit
    product: YKUSH XS single-port switch
    class: ykush
    serialNumber: unique
    notes:
      - Id per pykush; not in the local usb.ids database. List it with `ykushcmd ykushxs -l`.
  - vendorId: '04d8'
    productIds: ['f11b']
    vendor: Yepkit
    product: YKUSH3 3-port switchable hub
    class: ykush
    serialNumber: unique
    notes:
      - Id per pykush; not in the local usb.ids database. List it with `ykushcmd ykush3 -l`.
  - vendorId: '04b4'
    productIds: ['fd10', 'fd11', 'fd12', 'fd13', 'fd15']
    vendor: Gembird / Energenie
    product: SiS-PM, MSIS-PM, EG-PMS, EG-PMS2 switchable outlet strips
    class: sispm
    notes:
      - Labgrid resource SiSPMPowerPort with SiSPMPowerDriver; needs `sispmctl` on the host.
  - vendorId: '16c0'
    productIds: ['05df']
    vendor: dcttech
    product: USBRelay2 HID relay board
    class: hid-relay
    notes:
      - Labgrid resource HIDRelay with HIDRelayDriver; a relay can drive a power switch or reset line as a DigitalOutput.
      - The usb.ids entry is the generic Van Ooijen HID id, so other HID gadgets share it.
  - vendorId: '5131'
    productIds: ['2007']
    vendor: LC-US8
    product: 8-channel USB HID relay
    class: hid-relay
    notes:
      - Id per Labgrid's HIDRelay list; usb.ids maps the same id to an MSR card reader, so confirm the device before relying on it.

  # ---------------------------------------------------------------- Hubs
  - vendorId: '1d6b'
    productIds: ['0001', '0002', '0003']
    vendor: Linux Foundation
    product: USB root hub
    class: root-hub
    notes:
      - Host controller root hub; not a device you attach.
  - vendorId: '05e3'
    productIds: ['0608', '0610', '0612']
    vendor: Genesys Logic
    product: USB hub
    class: usb-hub
    notes:
      - Whether uhubctl can switch individual ports depends on the exact product and PCB; test with `uhubctl` before relying on USBPowerPort.
  - vendorId: '0424'
    productIds: ['2514', '2517', '2744', '5744']
    vendor: Microchip (SMSC)
    product: USB hub
    class: usb-hub
    notes:
      - Several Microchip hub controllers support per-port power switching, but the board must also route the enable pins; test with `uhubctl`.
  - vendorId: '2109'
    productIds: ['2817', '3431']
    vendor: VIA Labs
    product: USB hub
    class: usb-hub
    notes:
      - Test per-port switching with `uhubctl`; many consumer hubs only toggle the LED.
  - vendorId: '0bda'
    productIds: ['0411', '5411']
    vendor: Realtek
    product: RTS5411 USB hub
    class: usb-hub
    notes:
      - Test per-port switching with `uhubctl` before relying on USBPowerPort.
  - vendorId: '1a40'
    productIds: ['0101', '0201']
    vendor: Terminus Technology
    product: FE1.1 / FE2.1 USB hub
    class: usb-hub
    notes:
      - Test per-port switching with `uhubctl` before relying on USBPowerPort.

  # ---------------------------------------------------------------- Storage muxes
  - vendorId: '0424'
    productIds: ['4041']
    vendor: Linux Automation / Pengutronix
    product: USB-SD-Mux
    class: usb-sd-mux
    notes:
      - Id per Labgrid's USBSDMuxDevice; usb.ids names the controller a Microchip hub and media card controller.
      - Match with the ID_PATH that labgrid-suggest prints for the 0424:4041 device, or use the upstream example's '@ID_PATH' of the hub port it is plugged into. '@' keys only match parents, so never put the device's own path under '@ID_PATH'.
      - Needs the `usbsdmux` tool on the exporter host.
  - vendorId: '04e8'
    productIds: ['6001']
    vendor: Tizen / Samsung
    product: SDWire card reader
    class: usb-sd-wire
    notes:
      - Id per Labgrid's USBSDWireDevice, which also requires the parent hub 0424:2640.
      - Needs the `sd-mux-ctrl` tool.
  - vendorId: '0bda'
    productIds: ['0316']
    vendor: Badgerd
    product: SDWire3 card reader
    class: usb-sd-wire
    notes:
      - Id per Labgrid's USBSDWire3Device; usb.ids names the chip a Realtek card reader.
  - vendorId: '33f7'
    productIds: ['0001']
    vendor: Linux Automation
    product: LXA USB-Mux
    class: lxa-usb-mux
    notes:
      - Id per Labgrid's LXAUSBMux; needs the `usbmuxctl` tool.

  # ---------------------------------------------------------------- Other debug probes
  - vendorId: '15ba'
    productIds: ['0003', '0004', '002a', '002b']
    vendor: Olimex
    product: ARM-USB-OCD / ARM-USB-TINY JTAG probes
    class: usb-debugger
    chip: ftdi
    serialNumber: usually-unique
    notes:
      - FTDI-based; OpenOCD ships one script per model under interface/ftdi/ (for example interface/ftdi/olimex-arm-usb-ocd-h.cfg), so set interface_config to the matching file.
  - vendorId: '04b4'
    productIds: ['f155']
    vendor: Infineon / Cypress
    product: KitProg3 debug probe
    class: usb-debugger
    serialNumber: unique
    openocdInterface: interface/cmsis-dap.cfg
    notes:
      - Id per Labgrid's USBDebugger list. In CMSIS-DAP mode the probe uses interface/cmsis-dap.cfg; OpenOCD 0.12 ships no kitprog3.cfg (interface/kitprog.cfg is for the older KitProg).
  - vendorId: '09fb'
    productIds: ['6010', '6810']
    vendor: Altera / Intel
    product: USB-Blaster and USB-Blaster II
    class: altera-usb-blaster
    serialNumber: unique
    openocdInterface: interface/altera-usb-blaster.cfg
    notes:
      - Labgrid matches these ids with its AlteraUSBBlaster resource (not USBDebugger); OpenOCDDriver binds to it. USB-Blaster II (6810) uses interface/altera-usb-blaster2.cfg.
  - vendorId: '064b'
    productIds: ['0617', '2500', '0283', '2503', '2504', '2507', '2508', '250a', '250c', '250d']
    vendor: Analog Devices
    product: ICE emulator (JTAG debug probe)
    class: usb-debugger
    serialNumber: unique
    notes:
      - Ids per Labgrid's USBDebugger list; usb.ids only knows the vendor (Analog Devices, formerly White Mountain DSP).
      - These probes are normally driven by CrossCore Embedded Studio tools; OpenOCD support for ADI DSPs is limited, so plan a FlashScriptDriver or vendor tooling for flashing.

  # ---------------------------------------------------------------- Bootstrap loaders
  - vendorId: '15a2'
    productIds: ['0054', '0061', '0076', '007d', '0080']
    vendor: Freescale / NXP
    product: i.MX 6/7 SoC in serial download (recovery) mode
    class: imx-usb-loader
    notes:
      - Labgrid resource IMXUSBLoader with IMXUSBDriver (imx-usb-loader) or UUUDriver (uuu).
      - The id only appears while the SoC waits in serial download mode; it disappears once a bootloader runs.
  - vendorId: '1fc9'
    productIds: ['0128', '012b', '0134', '0135', '0146', '014e']
    vendor: NXP
    product: i.MX 8 / i.MX 9 SoC in serial download mode (SDP)
    class: imx-usb-loader
    notes:
      - Labgrid resource IMXUSBLoader; most i.MX 8M and i.MX 9 boards are bootstrapped with UUUDriver (uuu) rather than imx-usb-loader.
      - Ids per Labgrid's IMXUSBLoader list; usb.ids names only 012b (i.MX 8M Quad family).

  # ---------------------------------------------------------------- Fastboot
  - vendorId: '18d1'
    productIds: ['4ee0', 'd00d']
    vendor: Google
    product: Android device in fastboot mode
    class: fastboot
    notes:
      - Labgrid resource AndroidUSBFastboot; set usb_vendor_id and usb_product_id explicitly because the default is 1d6b:0104.
      - Vendor boards frequently use their own ids in fastboot mode; copy them from `lsusb` while the board waits in fastboot.

  # ---------------------------------------------------------------- Recognized but not usable by Labgrid
  - vendorId: '0456'
    productIds: ['b673']
    vendor: Analog Devices
    product: ADALM-PLUTO software-defined radio
    class: unsupported
    notes:
      - A libiio device; Labgrid has no resource for the IIO interface itself.
      - The PlutoSDR firmware can expose a CDC ACM serial console on the same USB connector; if enabled it shows up as a separate /dev/ttyACM* device that works as a USBSerialPort.
  - vendorId: '0456'
    productIds: ['b672']
    vendor: Analog Devices
    product: ADALM2000 instrument
    class: unsupported
    notes:
      - A libiio device; Labgrid has no resource for it.
  - vendorId: '2207'
    productIds: ['330c', '350a']
    vendor: Rockchip
    product: SoC in Mask ROM mode
    class: unsupported
    notes:
      - Labgrid has an RKUSBLoader resource with RKUSBDriver; this advisor does not generate it yet, so add it by hand following the upstream documentation.
      - usb.ids names 330c as RK3399; 350a is on Labgrid's RKUSBLoader list.

  # ---------------------------------------------------------------- More serial and debug devices
  - vendorId: '0483'
    productIds: ['5740']
    vendor: STMicroelectronics
    product: STM32 virtual COM port (USB CDC firmware)
    class: usb-serial
    chip: cdc-acm
    serialNumber: unique
    notes:
      - The target's own USB device stack; it disappears while the board is in reset or in the bootloader, so prefer a hardware UART for boot logs.
  - vendorId: '0525'
    productIds: ['a4a7']
    vendor: Linux-USB gadget
    product: Linux USB serial gadget (CDC ACM)
    class: usb-serial
    chip: cdc-acm
    serialNumber: none
    notes:
      - Provided by the Linux kernel running on the target, so it only exists after Linux boots; it cannot show bootloader output.
  - vendorId: '1d6b'
    productIds: ['0104']
    vendor: Linux Foundation
    product: Multifunction composite gadget (fastboot or DFU in U-Boot and barebox)
    class: fastboot
    notes:
      - Labgrid's AndroidUSBFastboot defaults to this id; U-Boot and barebox gadgets commonly use it for fastboot and DFU.
  - vendorId: '0451'
    productIds: ['bef3']
    vendor: Texas Instruments
    product: XDS110 debug probe (on LaunchPad boards)
    class: usb-serial
    chip: xds110
    serialNumber: unique
    notes:
      - usb.ids names the id after the CC1352R1 LaunchPad; the XDS110 firmware on most TI LaunchPads uses it and also exposes a CDC ACM back-channel UART (OpenOCD interface/xds110.cfg for the debug side).
      - Labgrid's USBDebugger resource does not match this id at v26.0-281, so OpenOCD flashing through Labgrid needs an upstream whitelist change; the console still works as a USBSerialPort.
  - vendorId: '1fc9'
    productIds: ['0090']
    vendor: NXP
    product: LPC-Link2 CMSIS-DAP probe
    class: usb-serial
    chip: daplink
    serialNumber: unique
    notes:
      - Id per the LPC-Link2 CMSIS-DAP firmware; not in the local usb.ids database. Check `lsusb -v` for the interface list.
      - Labgrid's USBDebugger resource does not match this id at v26.0-281, so OpenOCD flashing through Labgrid needs an upstream whitelist change; the console still works as a USBSerialPort.
  - vendorId: '1fc9'
    productIds: ['0143']
    vendor: NXP
    product: MCU-Link CMSIS-DAP probe
    class: usb-serial
    chip: daplink
    serialNumber: unique
    notes:
      - Id per the MCU-Link CMSIS-DAP firmware; not in the local usb.ids database. Provides a VCOM port as well.
      - Labgrid's USBDebugger resource does not match this id at v26.0-281, so OpenOCD flashing through Labgrid needs an upstream whitelist change; the console still works as a USBSerialPort.
  - vendorId: '0403'
    productIds: ['cff8']
    vendor: Amontec
    product: JTAGkey (FTDI-based)
    class: unsupported
    chip: ftdi
    serialNumber: usually-unique
    notes:
      - FTDI-based probe with a custom product id. Labgrid's USBDebugger whitelist only contains 0403:6010 and 0403:6014 at v26.0-281, so it is not matched; OpenOCD itself supports it with interface/ftdi/jtagkey.cfg.
  - vendorId: '03fd'
    productIds: ['0008']
    vendor: Xilinx
    product: Platform Cable USB II
    class: unsupported
    notes:
      - Driven by Vivado hw_server and xsdb, not by OpenOCD; Labgrid can still run those tools through a FlashScriptDriver.
  - vendorId: '1d50'
    productIds: ['608c']
    vendor: sigrok
    product: fx2lafw logic analyzer firmware
    class: unsupported
    notes:
      - Labgrid has a SigrokUSBDevice resource with SigrokDriver for measurements; this advisor does not generate it yet.
  - vendorId: '0bda'
    productIds: ['8153']
    vendor: Realtek
    product: RTL8153 USB gigabit Ethernet adapter
    class: unsupported
    notes:
      - Labgrid has a USBNetworkInterface resource for exporting a USB network adapter; this advisor does not generate it yet.
