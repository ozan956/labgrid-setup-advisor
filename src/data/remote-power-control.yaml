schemaVersion: 1
id: remote-power-control
title: Remote Power Control
description: Select a safe power-control method and generate Labgrid templates for a local bench or remote lab.

questions:
  - id: power-source
    text: How does the board receive power?
    help: Choose the cable or adapter that actually powers the board. Ignore USB cables used only for data or debugging.
    options:
      - value: usb
        label: Through the USB port I want to switch
        description: That USB connection supplies the board's operating power, not only data.
      - value: external-adapter
        label: Through a separate DC adapter
        description: A separate mains adapter supplies the board's DC input.
      - value: unknown
        label: I am not sure
        description: Stop before choosing switching hardware and identify the board's real power input first.

  - id: output-count
    text: How many power outputs should Labgrid control?
    help: Count the ports or outlets that must be switched independently, not the number of cables connected to a board.
    options:
      - value: one
        label: One board or power channel
        description: Labgrid controls one USB port, PDU outlet, or manual power action.
      - value: multiple
        label: Multiple independent power channels
        description: Each board or load needs its own separately controlled port, outlet, and Labgrid resource.

  - id: controller
    text: Which device will switch the power?
    help: A normal USB hub is not enough. Choose the tested option only if uhubctl can already switch its ports independently.
    options:
      - value: smart-usb-hub
        label: A USB hub already tested with uhubctl
        description: uhubctl can turn each required downstream port off and on independently.
      - value: untested-usb-hub
        label: A USB hub I have not tested yet
        description: Check its per-port power behavior before generating a Labgrid configuration.
      - value: ykush
        label: A Yepkit YKUSH
        description: A supported YKUSH, YKUSH XS, or YKUSH3 device controlled with ykushcmd.
      - value: network-pdu
        label: A network-controlled PDU
        description: A network power switch with a Labgrid backend for its protocol and model.
      - value: none
        label: No control hardware yet
        description: Start with manual power or choose hardware matched to the electrical load.

  - id: location
    text: Who needs to use this setup?
    help: Choose whether this computer controls the hardware directly, another Linux host provides access, or the setup is shared.
    options:
      - value: local
        label: Only me, from this computer
        description: This computer can reach the power controller directly and runs any required helper tool.
      - value: remote-host
        label: Only me, through another Linux host
        description: A dedicated Linux host beside the hardware makes its controller available to my computer.
      - value: remote-lab
        label: Several people or CI jobs
        description: The setup is shared, so Labgrid must prevent two users from controlling the same board at once.

  - id: pdu-model
    text: Which network PDU family do you have?
    help: The model value selects a real Labgrid backend. Unknown hardware must be checked before generating a usable config.
    visibleWhen:
      all:
        - question: controller
          equals: network-pdu
    options:
      - value: netio
        label: NETIO
        description: NETIO 4-Port devices supported by the netio backend.
      - value: gude
        label: Gude
        description: Gude devices supported by the gude backend; exact families may use another Gude backend.
      - value: eaton
        label: Eaton ePDU
        description: Eaton ePDUs controlled over SNMP with Labgrid's optional SNMP dependencies.
      - value: apc
        label: APC PDU
        description: APC power distribution units supported by Labgrid's SNMP backend.
      - value: unknown
        label: Another or unknown model
        description: Check the upstream backend list and device protocol before writing configuration.

recommendations:
  - id: generic-usb-power
    category: approach
    title: Control power through a compatible USB hub
    summary: Use a hub verified for per-port power switching. This turns one USB port off and on; it does not control a separate power adapter.
    when:
      all:
        - question: power-source
          equals: usb
        - question: controller
          equals: smart-usb-hub
    why:
      - The board receives operating power from the USB port you intend to switch.
      - Your controller is a generic hub, so Labgrid delegates switching to uhubctl.
      - Compatibility must be verified because most USB hubs do not implement independent port power control correctly.
    requirements:
      hardware:
        - A hub listed as compatible by uhubctl or verified locally with equivalent per-port behavior.
        - A USB port whose voltage and current are within the board's published input specifications.
      software:
        - Labgrid on the machine running the driver.
        - uhubctl and permission to control the hub on the machine physically connected to it.
    components:
      - kind: resource
        name: USBPowerPort / NetworkUSBPowerPort
        reason: Identifies one downstream port locally or after exporter translation.
      - kind: driver
        name: USBPowerDriver
        reason: Implements PowerProtocol and ResetProtocol using uhubctl.
    architecture:
      - label: Labgrid driver
        detail: Runs uhubctl where the hub is attached.
      - label: Smart USB hub
        detail: Switches VBUS for one verified downstream port.
      - label: USB-powered board
        detail: Receives power only within its documented USB limits.
    commands:
      - command: uhubctl
        description: List hubs and confirm that the selected hub exposes controllable ports before configuring Labgrid.
      - command: labgrid-suggest
        description: Discover stable udev match candidates; fill in the port index yourself.
    nextSteps:
      - Run uhubctl on the computer connected to the hub and confirm that the required port can be switched independently.
      - Connect only a board whose USB input is within the hub and board electrical limits.
      - Replace the generated template placeholders with the hub path and downstream port number.
    documentation: [usb-power, suggest, uhubctl]

  - id: ykush-power
    category: approach
    title: Control USB power with a Yepkit YKUSH
    summary: Connect the board to a supported YKUSH port and let Labgrid turn that USB port off and on.
    when:
      all:
        - question: power-source
          equals: usb
        - question: controller
          equals: ykush
    why:
      - The board is powered by the selected USB port.
      - Labgrid has explicit YKUSH resource and driver classes instead of treating this as a generic uhubctl device.
    requirements:
      hardware:
        - A supported Yepkit YKUSH, YKUSH XS, or YKUSH3 with a known serial number and downstream port.
        - A board whose USB input stays within both board and YKUSH electrical specifications.
      software:
        - Labgrid on the machine running the driver.
        - ykushcmd on the machine physically connected to the YKUSH.
    components:
      - kind: resource
        name: YKUSHPowerPort / NetworkYKUSHPowerPort
        reason: Identifies the YKUSH by serial number and downstream port.
      - kind: driver
        name: YKUSHPowerDriver
        reason: Finds the YKUSH model and invokes ykushcmd for on, off, cycle, and status.
    architecture:
      - label: Labgrid driver
        detail: Invokes ykushcmd locally or through the exporter host.
      - label: YKUSH
        detail: Switches the selected downstream USB port.
      - label: USB-powered board
        detail: Receives switched USB power within documented ratings.
    commands:
      - command: ykushcmd -l
        description: List connected YKUSH devices and record the serial number.
    nextSteps:
      - Run ykushcmd -l on the computer connected to the YKUSH and record its serial number.
      - Connect the board to a YKUSH port that stays within the published electrical limits.
      - Replace the generated template placeholders with the YKUSH serial number and port number.
    documentation: [configuration, ykush]

  - id: network-pdu-power
    category: approach
    title: Control the board's power adapter through the PDU
    summary: Plug the board's approved adapter into one supported PDU outlet, then let Labgrid switch that complete outlet.
    when:
      all:
        - question: controller
          equals: network-pdu
        - question: power-source
          in: [usb, external-adapter]
    why:
      - A network PDU is controlled directly over the network and maps to NetworkPowerPort.
      - The selected backend determines the PDU protocol; host and outlet index remain site-specific.
      - One resource represents one outlet, so independent devices should use distinct resources and outlets.
    requirements:
      hardware:
        - A PDU model supported by the selected Labgrid backend.
        - One correctly rated outlet per independently controlled external adapter.
        - The board manufacturer's approved adapter, or an electrically equivalent supply.
      software:
        - Labgrid with any optional dependency required by the selected backend.
        - Network reachability from the client or exporter that runs NetworkPowerDriver.
    components:
      - kind: resource
        name: NetworkPowerPort
        reason: Stores the exact backend model, PDU host, and outlet index.
      - kind: driver
        name: NetworkPowerDriver
        reason: Loads the selected backend and implements PowerProtocol and ResetProtocol.
    architecture:
      - label: Labgrid driver
        detail: Calls the backend selected by the resource's model field.
      - label: Network PDU
        detail: Switches one complete mains outlet.
      - label: Approved adapter
        detail: Converts mains power to the board's required DC input.
      - label: Board
        detail: Receives the voltage, polarity, and current specified by its manufacturer.
    commands: []
    nextSteps:
      - Confirm that the selected Labgrid backend supports the exact PDU model and firmware.
      - Plug the board's approved adapter into one correctly rated PDU outlet.
      - Replace the generated template placeholders with the PDU address and exact outlet number.
    documentation: [configuration, power-backends]

  - id: no-hardware-usb
    category: approach
    title: Start with manual power control
    summary: Ask the operator to switch power for now. Add a compatible USB hub or YKUSH later when you need automation.
    when:
      all:
        - question: power-source
          equals: usb
        - question: controller
          equals: none
    why:
      - No device is available for Labgrid to switch safely.
      - ManualPowerDriver preserves a valid PowerProtocol workflow without claiming automation.
    requirements:
      hardware:
        - No extra hardware for manual operation.
        - For automation, a verified smart USB hub or supported YKUSH within the board's electrical limits.
      software:
        - Labgrid; pytest must run with uncaptured input for manual prompts.
    components:
      - kind: driver
        name: ManualPowerDriver
        reason: Prompts a person to turn power on, off, or cycle it.
    architecture:
      - label: Labgrid
        detail: Pauses and asks for a manual power action.
      - label: Operator
        detail: Switches the board and confirms completion.
    commands:
      - command: pytest --lg-env environment.yaml --capture=no
        description: Allow ManualPowerDriver prompts to reach the terminal during tests.
    nextSteps:
      - Use the board's normal USB power path and switch it manually when Labgrid prompts you.
      - Choose a tested uhubctl hub or supported YKUSH before enabling automatic switching.
    documentation: [configuration]

  - id: no-hardware-external
    category: approach
    title: Start with manual outlet control
    summary: Ask the operator to switch the adapter for now. Add a supported network PDU or engineered relay before automating it.
    when:
      all:
        - question: controller
          equals: none
        - question: power-source
          equals: external-adapter
    why:
      - No controller is available for safe automation.
      - External adapters and multiple loads need correctly rated, independently identified switching channels.
    requirements:
      hardware:
        - No extra hardware for manual operation.
        - For automation, supported switching hardware sized and wired for the actual load.
      software:
        - Labgrid; pytest must run with uncaptured input for manual prompts.
    components:
      - kind: driver
        name: ManualPowerDriver
        reason: Keeps manual control explicit until suitable switching hardware is installed.
    architecture:
      - label: Labgrid
        detail: Requests a power action but does not energize hardware itself.
      - label: Operator
        detail: Uses the board's normal, electrically safe power path.
    commands:
      - command: pytest --lg-env environment.yaml --capture=no
        description: Allow ManualPowerDriver prompts to reach the terminal during tests.
    nextSteps:
      - Keep using the board's approved adapter and switch it manually when Labgrid prompts you.
      - Select switching hardware rated for the real load before enabling automatic control.
    documentation: [configuration]

  - id: unknown-power-source
    category: warning
    title: Identify the board's power input first
    summary: Do not choose switching hardware until you know which cable or adapter actually powers the board.
    when:
      all:
        - question: power-source
          equals: unknown
    why:
      - A USB data connection does not always supply the board's operating power.
      - Switching the wrong path may leave the board powered or create an unintended back-power path.
    requirements:
      hardware:
        - The board manual, schematic, or a verified description of its power inputs.
      software: []
    components: []
    architecture: []
    commands: []
    nextSteps:
      - Check the board manual and trace every connected power input, including USB, debug probes, and external adapters.
      - Return to the questions after you can identify the input that supplies operating power.
    documentation: [configuration]

  - id: verify-usb-hub
    category: warning
    title: Test the USB hub before configuring Labgrid
    summary: Owning a USB hub is not enough. Confirm that uhubctl can switch each required downstream port independently.
    when:
      all:
        - question: power-source
          equals: usb
        - question: controller
          equals: untested-usb-hub
    why:
      - Many hubs report power-switching features but cannot remove power from one port independently.
      - A configuration generated before this check could claim to cycle power while the board remains powered.
    requirements:
      hardware:
        - The exact hub connected to the Linux computer that will control it.
      software:
        - uhubctl and permission to access the hub.
    components: []
    architecture: []
    commands:
      - command: uhubctl
        description: List the hub and verify real per-port power switching before returning to the advisor.
    nextSteps:
      - Install uhubctl on the computer connected to the hub.
      - Test the exact downstream port and confirm that the board really loses and regains power.
      - Return and select the tested-hub option only after that check succeeds.
    documentation: [uhubctl]

  - id: multiple-output-guidance
    category: warning
    title: Configure every power channel separately
    summary: The generated template shows one channel. Add one distinct Labgrid resource and matching driver instance for every independently switched USB port or PDU outlet.
    when:
      all:
        - question: output-count
          equals: multiple
        - question: controller
          in: [smart-usb-hub, ykush, network-pdu]
    why:
      - One Labgrid power resource represents one physical port or outlet.
      - Reusing one resource for several loads would prevent independent control and make test ownership unclear.
    requirements:
      hardware:
        - One correctly rated, independently switchable channel for each board or load.
      software: []
    components: []
    architecture: []
    commands: []
    nextSteps:
      - Record which board is connected to each physical port or outlet.
      - Duplicate and uniquely name the resource and driver entry for each channel.
      - Test every channel separately before running a multi-board job.
    documentation: [configuration]

  - id: incompatible-usb-controller
    category: warning
    title: This USB controller cannot switch the external adapter
    summary: USBPowerDriver and YKUSHPowerDriver switch downstream USB power. They do not disconnect a separate DC adapter or arbitrary mains-powered devices.
    when:
      all:
        - question: controller
          in: [smart-usb-hub, untested-usb-hub, ykush]
        - question: power-source
          equals: external-adapter
    why:
      - The electrical load and selected control path do not match.
      - Rewiring power without checking voltage, polarity, current, grounding, and isolation can damage equipment or create a safety hazard.
    requirements:
      hardware:
        - Select a supported PDU or a professionally designed, correctly rated relay path for the real load.
      software: []
    components: []
    architecture: []
    commands: []
    nextSteps:
      - Keep the external adapter connected exactly as its manufacturer specifies.
      - Choose a supported network PDU or an engineered switching path rated for that adapter.
    documentation: [configuration, uhubctl]

  - id: unknown-pdu
    category: warning
    title: Check that Labgrid supports this exact PDU
    summary: Labgrid does not have a universal network-PDU protocol. Confirm an exact backend or implement one upstream before configuring NetworkPowerPort.
    when:
      all:
        - question: controller
          equals: network-pdu
        - question: pdu-model
          equals: unknown
    why:
      - The `model` field is a Python backend module name, not a free-form product label.
      - Generating a model value without a known backend would produce a broken configuration.
    requirements:
      hardware:
        - Exact manufacturer, model, firmware, network protocol, and outlet numbering.
      software:
        - A matching backend from Labgrid's documented list.
    components: []
    architecture: []
    commands: []
    nextSteps:
      - Record the exact PDU manufacturer, model, firmware, protocol, and outlet numbering.
      - Compare those details with Labgrid's backend list before returning to the advisor.
    documentation: [power-backends]

  - id: usb-board-on-pdu
    category: warning
    title: The PDU switches the complete adapter outlet
    summary: This is whole-outlet control. Use a manufacturer-approved USB power adapter and do not describe the result as per-port USB switching.
    when:
      all:
        - question: power-source
          equals: usb
        - question: controller
          equals: network-pdu
    why:
      - NetworkPowerDriver switches the mains outlet feeding the adapter.
      - USB data may remain connected through another path, which can back-power some boards.
    requirements:
      hardware:
        - A safe adapter and wiring arrangement that prevents unintended back-power paths.
      software: []
    components: []
    architecture: []
    commands: []
    nextSteps:
      - Confirm that the board is powered through an approved USB adapter connected to the selected PDU outlet.
      - Check for other USB or debug connections that could keep the board powered when that outlet is off.
    documentation: [configuration]

  - id: local-topology
    category: topology
    title: Run the setup from this computer
    summary: A single local configuration is enough when this computer reaches the controller and nobody else needs to reserve it.
    when:
      all:
        - question: location
          equals: local
    why:
      - Local resources can be declared directly under one target.
      - Avoiding distributed services keeps a single-user bench simple.
    requirements:
      hardware: []
      software:
        - Labgrid and hardware-specific helper tools on this computer.
    components:
      - kind: infrastructure
        name: Local environment file
        reason: Defines resources and drivers directly; no RemotePlace is involved.
    architecture:
      - label: Developer or test
        detail: Loads the environment YAML on this computer.
      - label: Labgrid driver
        detail: Talks directly to the local controller or reachable PDU.
    commands: []
    documentation: [configuration]

  - id: distributed-topology
    category: topology
    title: Share power control safely over the network
    summary: Run Labgrid beside the hardware and use its coordination service so remote users or CI jobs cannot control the same board at the same time.
    when:
      any:
        - question: location
          equals: remote-host
        - question: location
          equals: remote-lab
    why:
      - The hardware is not local to the developer or CI client.
      - The coordinator tracks resources and enforces exclusive place acquisition.
      - USB helper commands execute on the exporter host; the coordinator remains control-plane infrastructure.
    requirements:
      hardware:
        - A Linux exporter host with physical access to USB controllers, or network access to the PDU.
      software:
        - labgrid-exporter on the hardware-side host.
        - labgrid-coordinator reachable by exporter and clients.
        - SSH access from clients to the exporter where Labgrid requires remote command execution.
    components:
      - kind: infrastructure
        name: labgrid-exporter
        reason: Discovers or publishes hardware-side resources and runs required host-local tools.
      - kind: infrastructure
        name: labgrid-coordinator
        reason: Tracks resources, places, acquisitions, and reservations; it is not the hardware data path.
      - kind: resource
        name: RemotePlace
        reason: Expands the acquired place into resources for the client target.
    architecture:
      - label: Developer / CI client
        detail: Acquires a named place and loads the client environment.
      - label: Coordinator
        detail: Provides discovery and exclusive allocation, not power transport.
      - label: Exporter host
        detail: Publishes the resource and runs local tools when necessary.
      - label: Power controller
        detail: Switches the verified USB port or network outlet.
    commands:
      - command: labgrid-client -p <PLACE_NAME> acquire
        description: Acquire exclusive access before controlling the board.
      - command: labgrid-client -p <PLACE_NAME> power cycle
        description: Cycle the matched power resource.
      - command: labgrid-client -p <PLACE_NAME> release
        description: Release the place after use.
    documentation: [getting-started, exporter, overview]

configurations:
  - id: local-usb-power
    title: Local environment
    filename: environment.yaml
    kind: environment
    when:
      all:
        - question: power-source
          equals: usb
        - question: controller
          equals: smart-usb-hub
        - question: location
          equals: local
    template: |
      targets:
        main:
          resources:
            USBPowerPort:
              match:
                ID_PATH: '{{UDEV_ID_PATH}}'
              index: {{USB_PORT_INDEX}}
          drivers:
            USBPowerDriver: {}
    placeholders:
      - token: UDEV_ID_PATH
        label: Hub udev ID_PATH
        description: Stable path for the hub interface, normally ending in :1.0; discover it with labgrid-suggest or udevadm.
        example: pci-0000:00:14.0-usb-0:2:1.0
        required: true
      - token: USB_PORT_INDEX
        label: Downstream port index
        description: Physical controllable port number reported by uhubctl.
        example: '1'
        required: true

  - id: remote-usb-exporter
    title: Exporter resources
    filename: exporter.yaml
    kind: exporter
    when:
      all:
        - question: power-source
          equals: usb
        - question: controller
          equals: smart-usb-hub
        - question: location
          in: [remote-host, remote-lab]
    template: |
      {{EXPORT_GROUP}}:
        USBPowerPort:
          match:
            ID_PATH: '{{UDEV_ID_PATH}}'
          index: {{USB_PORT_INDEX}}
    placeholders:
      - token: EXPORT_GROUP
        label: Exporter group
        description: Stable group name for this board or setup.
        example: board-01
        required: true
      - token: UDEV_ID_PATH
        label: Hub udev ID_PATH
        description: Stable hub-interface path on the exporter host, normally ending in :1.0.
        example: pci-0000:00:14.0-usb-0:2:1.0
        required: true
      - token: USB_PORT_INDEX
        label: Downstream port index
        description: Physical controllable port number reported by uhubctl on the exporter host.
        example: '1'
        required: true

  - id: remote-usb-client
    title: Client environment
    filename: remote.yaml
    kind: environment
    when:
      all:
        - question: power-source
          equals: usb
        - question: controller
          equals: smart-usb-hub
        - question: location
          in: [remote-host, remote-lab]
    template: |
      targets:
        main:
          resources:
            RemotePlace:
              name: '{{PLACE_NAME}}'
          drivers:
            USBPowerDriver: {}
    placeholders:
      - token: PLACE_NAME
        label: Coordinator place
        description: Place whose match includes the exported USBPowerPort.
        example: board-01
        required: true

  - id: local-ykush-power
    title: Local environment
    filename: environment.yaml
    kind: environment
    when:
      all:
        - question: power-source
          equals: usb
        - question: controller
          equals: ykush
        - question: location
          equals: local
    template: |
      targets:
        main:
          resources:
            YKUSHPowerPort:
              serial: '{{YKUSH_SERIAL}}'
              index: '{{YKUSH_PORT_INDEX}}'
          drivers:
            YKUSHPowerDriver: {}
    placeholders:
      - token: YKUSH_SERIAL
        label: YKUSH serial
        description: Serial printed by ykushcmd -l.
        example: YK12345
        required: true
      - token: YKUSH_PORT_INDEX
        label: YKUSH port
        description: Downstream YKUSH port connected to the board.
        example: '1'
        required: true

  - id: remote-ykush-exporter
    title: Exporter resources
    filename: exporter.yaml
    kind: exporter
    when:
      all:
        - question: power-source
          equals: usb
        - question: controller
          equals: ykush
        - question: location
          in: [remote-host, remote-lab]
    template: |
      {{EXPORT_GROUP}}:
        YKUSHPowerPort:
          serial: '{{YKUSH_SERIAL}}'
          index: '{{YKUSH_PORT_INDEX}}'
    placeholders:
      - token: EXPORT_GROUP
        label: Exporter group
        description: Stable group name for this board or setup.
        example: board-01
        required: true
      - token: YKUSH_SERIAL
        label: YKUSH serial
        description: Serial printed by ykushcmd -l on the exporter host.
        example: YK12345
        required: true
      - token: YKUSH_PORT_INDEX
        label: YKUSH port
        description: Downstream YKUSH port connected to the board.
        example: '1'
        required: true

  - id: remote-ykush-client
    title: Client environment
    filename: remote.yaml
    kind: environment
    when:
      all:
        - question: power-source
          equals: usb
        - question: controller
          equals: ykush
        - question: location
          in: [remote-host, remote-lab]
    template: |
      targets:
        main:
          resources:
            RemotePlace:
              name: '{{PLACE_NAME}}'
          drivers:
            YKUSHPowerDriver: {}
    placeholders:
      - token: PLACE_NAME
        label: Coordinator place
        description: Place whose match includes the exported YKUSHPowerPort.
        example: board-01
        required: true

  - id: local-network-pdu
    title: Local environment
    filename: environment.yaml
    kind: environment
    when:
      all:
        - question: controller
          equals: network-pdu
        - question: pdu-model
          in: [netio, gude, eaton, apc]
        - question: location
          equals: local
    template: |
      targets:
        main:
          resources:
            NetworkPowerPort:
              model: '{{answer:pdu-model}}'
              host: '{{PDU_HOST}}'
              index: {{PDU_OUTLET_INDEX}}
          drivers:
            NetworkPowerDriver: {}
    placeholders:
      - token: PDU_HOST
        label: PDU hostname or address
        description: Backend-specific hostname, address, or URL; do not commit credentials.
        example: pdu.example.org
        required: true
      - token: PDU_OUTLET_INDEX
        label: PDU outlet index
        description: Exact outlet number used by the selected backend and physical PDU.
        example: '1'
        required: true

  - id: remote-network-pdu-exporter
    title: Exporter resources
    filename: exporter.yaml
    kind: exporter
    when:
      all:
        - question: controller
          equals: network-pdu
        - question: pdu-model
          in: [netio, gude, eaton, apc]
        - question: location
          in: [remote-host, remote-lab]
    template: |
      {{EXPORT_GROUP}}:
        NetworkPowerPort:
          model: '{{answer:pdu-model}}'
          host: '{{PDU_HOST}}'
          index: {{PDU_OUTLET_INDEX}}
    placeholders:
      - token: EXPORT_GROUP
        label: Exporter group
        description: Stable group name for this board or setup.
        example: board-01
        required: true
      - token: PDU_HOST
        label: PDU hostname or address
        description: Address reachable by the client or exporter according to site routing; do not commit credentials.
        example: pdu.example.org
        required: true
      - token: PDU_OUTLET_INDEX
        label: PDU outlet index
        description: Exact outlet number used by the selected backend and physical PDU.
        example: '1'
        required: true

  - id: remote-network-pdu-client
    title: Client environment
    filename: remote.yaml
    kind: environment
    when:
      all:
        - question: controller
          equals: network-pdu
        - question: pdu-model
          in: [netio, gude, eaton, apc]
        - question: location
          in: [remote-host, remote-lab]
    template: |
      targets:
        main:
          resources:
            RemotePlace:
              name: '{{PLACE_NAME}}'
          drivers:
            NetworkPowerDriver: {}
    placeholders:
      - token: PLACE_NAME
        label: Coordinator place
        description: Place whose match includes the exported NetworkPowerPort.
        example: board-01
        required: true

  - id: local-manual-power
    title: Local manual environment
    filename: environment.yaml
    kind: environment
    when:
      all:
        - question: controller
          equals: none
        - question: location
          equals: local
    template: |
      targets:
        main:
          drivers:
            ManualPowerDriver:
              name: '{{BOARD_NAME}}'
    placeholders:
      - token: BOARD_NAME
        label: Board name
        description: Human-readable name shown in manual power prompts.
        example: example-board
        required: true

