  # ---------------------------------------------------------------- Rockchip / Allwinner / Amlogic SBCs
  - id: radxa-rock-5b
    name: Radxa ROCK 5B
    vendor: Radxa
    family: rockchip
    uboot: rock5b-rk3588
    buildroot: rock5b
    curation: docs
    console:
      interface: uart-header
      note: Debug UART on the 40-pin header (pins 8 TX and 10 RX, 3.3 V) at 1500000 baud; make sure the USB-UART adapter supports 1.5 Mbaud (FT232-class adapters do).
    power:
      inputs: [usb-c]
      note: USB-C power delivery (9 to 20 V); switch the mains adapter, not the USB cable.
    flashing: [sd-card]
    tags: [arm64, linux, sbc]
    notes:
      - Maskrom mode exposes the RK3588 as 2207:350b for rkdeveloptool (eMMC and SPI flashing); wrap it in a FlashScriptDriver.
    docs:
      - title: ROCK 5B documentation
        url: https://docs.radxa.com/en/rock5/rock5b
  - id: pine64-rockpro64
    name: Pine64 ROCKPro64
    vendor: Pine64
    family: rockchip
    uboot: rockpro64-rk3399
    buildroot: rockpro64
    curation: docs
    console:
      interface: uart-header
      note: UART2 on the Pi-2 bus header (pins 6 GND, 8 TX, 10 RX; 3.3 V) at 1500000 baud; the adapter must support 1.5 Mbaud.
    power:
      inputs: [barrel]
      note: 12 V barrel jack (5.5 mm / 2.1 mm); switch the mains adapter.
    flashing: [sd-card]
    tags: [arm64, linux, sbc]
    notes:
      - Maskrom mode exposes the RK3399 as 2207:330c for rkdeveloptool; wrap it in a FlashScriptDriver.
    docs:
      - title: ROCKPro64 wiki
        url: https://wiki.pine64.org/wiki/ROCKPro64
  - id: pine64-quartz64-a
    name: Pine64 Quartz64 Model A
    vendor: Pine64
    family: rockchip
    uboot: quartz64-a-rk3566
    curation: docs
    console:
      interface: uart-header
      note: UART2 on the Pi-2 bus header (3.3 V) at 1500000 baud; the adapter must support 1.5 Mbaud.
    power:
      inputs: [barrel]
      note: 12 V barrel jack; switch the mains adapter.
    flashing: [sd-card]
    tags: [arm64, linux, sbc]
    docs:
