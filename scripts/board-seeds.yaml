    curation: docs
    console:
      interface: cdc-acm
      chip: daplink
      note: The on-board MAX32625PICO-based DAPLink (CMSIS-DAP, 0d28:0204) provides the console as /dev/ttyACM* and the debugger on one micro-USB cable. The console works as a USBSerialPort; Labgrid's USBDebugger does not match DAPLink at v26.0-281.
