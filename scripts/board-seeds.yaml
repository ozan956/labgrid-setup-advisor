    name: Analog Devices AD9081-FMCA-EBZ on AMD ZCU102
    vendor: Analog Devices
    family: zynqmp
    uboot: xilinx_zynqmp_virt
    dts: xilinx/zynqmp-zcu102-rev1.0
    buildroot: zynqmp_zcu102
    curation: docs
    console:
      interface: onboard-usb
      chip: ftdi
      note: The ZCU102 USB-UART/JTAG connector exposes an FT4232 with four ttyUSB ports; the PS UART0 console is usually the first or second port, so test each and pin it with ID_USB_INTERFACE_NUM.
    power:
      inputs: [other]
      note: 12 V supply with a 6-pin connector on the ZCU102; switch the mains adapter with a PDU.
    flashing: [sd-card, jtag-vendor]
