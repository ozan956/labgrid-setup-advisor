      - The kernel describes the K26 SOM (zynqmp-smk-k26) plus a carrier overlay; U-Boot's xilinx_zynqmp_virt defconfig covers the whole Kria family.
    docs:
      - title: Kria documentation
        url: https://xilinx.github.io/kria-apps-docs/
  - id: amd-zc702
    name: AMD/Xilinx ZC702 evaluation kit
