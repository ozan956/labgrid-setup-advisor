      interface: onboard-usb
      note: The UART mini-USB connector uses a Cypress USB-UART bridge that appears as /dev/ttyACM*.
    power:
      inputs: [barrel]
      note: 12 V barrel jack with a power switch on the board; switch the mains adapter with a PDU.
    flashing: [sd-card, jtag-vendor]
    tags: [arm, fpga, linux, evk]
    docs:
      - title: ZC702 evaluation kit
        url: https://www.xilinx.com/products/boards-and-kits/ek-z7-zc702-g.html
  - id: digilent-zybo-z7
    name: Digilent Zybo Z7
    vendor: Digilent
    family: zynq
    uboot: xilinx_zynq_virt
    dts: xilinx/zynq-zybo-z7
    curation: docs
    console:
      interface: onboard-usb
      chip: ftdi
      note: The PROG/UART micro-USB connector carries an FTDI FT2232H; channel A is JTAG and channel B the UART, so the console is the second ttyUSB port (ID_USB_INTERFACE_NUM '01').
    power:
      inputs: [barrel, micro-usb]
      note: 5 V barrel jack or USB power through the PROG/UART connector, selected by a jumper; USB power can be switched by a hub port, the jack needs a PDU.
    flashing: [sd-card, jtag-vendor]
    tags: [arm, fpga, linux, evk]
    docs:
      - title: Zybo Z7 reference
        url: https://digilent.com/reference/programmable-logic/zybo-z7/start

  # ---------------------------------------------------------------- Analog Devices
  - id: adi-fmcomms2-zc706
    name: Analog Devices AD-FMCOMMS2/3-EBZ on Xilinx ZC706
    vendor: Analog Devices
    family: zynq
    uboot: xilinx_zynq_virt
    dts: xilinx/zynq-zc706
    buildroot: zynq_zc706
    curation: docs
    console:
      interface: onboard-usb
      chip: cp210x
      note: The ZC706 USB-UART connector uses a Silicon Labs CP2103 bridge (a single ttyUSB port).
    power:
      inputs: [other]
      note: 12 V supply with a 6-pin connector on the ZC706; switch the mains adapter with a PDU. The FMC card draws its power from the carrier.
    flashing: [sd-card, jtag-vendor]
    tags: [arm, fpga, linux, rf, sdr]
    notes:
      - ADI Kuiper Linux images boot from the SD card with a carrier-specific boot partition; the FMC card has no console or power of its own.
    docs:
      - title: AD-FMCOMMS2-EBZ user guide
        url: https://wiki.analog.com/resources/eval/user-guides/ad-fmcomms2-ebz
      - title: ZC706 evaluation kit
        url: https://www.xilinx.com/products/boards-and-kits/ek-z7-zc706-g.html
