  - id: adi-adsp-sc598-som-ezkit
    name: Analog Devices ADSP-SC598 SOM EZ-KIT
    vendor: Analog Devices
    family: sharc
    uboot: sc598-som-ezkit-spl
    dts: adi/sc598-som-ezkit
    curation: docs
    console:
      interface: onboard-usb
      note: USB-UART on the EZ-KIT carrier board; confirm the bridge and port in the EZ-KIT manual for your revision.
    power:
      inputs: [barrel]
      note: External DC supply shipped with the kit; switch the mains adapter with a PDU.
    flashing: [sd-card, jtag-vendor]
    bootloader:
      note: Upstream U-Boot keeps the default prompt; the ADI Linux Add-In build may differ, so capture it from a boot log before configuring a UBootDriver. Flashing goes through an ICE-1000 or ICE-2000 emulator with CrossCore tools, which Labgrid can run via a FlashScriptDriver.
    tags: [arm64, dsp, linux, evk]
    docs:
      - title: Linux for ADSP-SC5xx
        url: https://wiki.analog.com/resources/tools-software/linuxdsp
  - id: adi-max32690-evkit
    name: Analog Devices MAX32690 EVKIT
    vendor: Analog Devices
    family: max32
    openocdTarget: max32690
    curation: docs
    console:
      interface: cdc-acm
      chip: daplink
      note: The on-board DAPLink (CMSIS-DAP, 0d28:0204) provides the console as /dev/ttyACM* and the debugger on one USB cable. The console works as a USBSerialPort; Labgrid's USBDebugger does not match DAPLink at v26.0-281.
