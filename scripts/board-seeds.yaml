  # ---------------------------------------------------------------- RISC-V
  - id: starfive-visionfive-2
    name: StarFive VisionFive 2
    vendor: StarFive
    family: jh7110
    uboot: starfive_visionfive2
    buildroot: visionfive2
    curation: docs
    console:
      interface: uart-header
      note: UART on the 40-pin header (pins 6 GND, 8 TX, 10 RX; 3.3 V) at 115200 baud.
    power:
      inputs: [usb-c, poe]
      note: USB-C 5 V / 3 A, or PoE with the optional module; switch the mains adapter or the PoE port.
    flashing: [sd-card]
    tags: [riscv, linux, sbc]
    notes:
      - The boot-mode DIP switches select SD, eMMC, QSPI or UART recovery; the recovery mode loads the SPL over the same UART.
    docs:
      - title: VisionFive 2 quick start guide
        url: https://doc-en.rvspace.org/VisionFive2/Quick_Start_Guide/
  - id: sifive-hifive-unmatched
    name: SiFive HiFive Unmatched
    vendor: SiFive
    family: fu740
    uboot: sifive_unmatched
    buildroot: hifive_unmatched
    curation: docs
    console:
      interface: onboard-usb
      chip: ftdi
      note: The micro-USB connector carries an FT2232H; one channel is JTAG and the other the console, so the console is the second ttyUSB port (ID_USB_INTERFACE_NUM '01').
    power:
      inputs: [atx]
      note: Standard ATX supply (24-pin) in a mini-ITX chassis; switch the mains with a PDU and let the board's power-on logic start it, or wire the ATX power-on pins.
    flashing: [sd-card]
    tags: [riscv, linux, sbc]
    docs:
      - title: HiFive Unmatched
        url: https://www.sifive.com/boards/hifive-unmatched
  - id: microchip-mpfs-icicle-kit
    name: Microchip PolarFire SoC Icicle Kit
    vendor: Microchip
    family: polarfire-soc
    uboot: microchip_mpfs_icicle
    buildroot: microchip_mpfs_icicle
    curation: docs
    console:
      interface: onboard-usb
      chip: ftdi
      note: The USB-UART micro-USB connector carries an FT4232H with four ttyUSB ports; the Hart Software Services use the first and Linux the second (ID_USB_INTERFACE_NUM '01').
    power:
      inputs: [barrel]
      note: 12 V barrel jack; switch the mains adapter.
    flashing: [sd-card, jtag-vendor]
    tags: [riscv, fpga, linux, evk]
    notes:
      - The FPGA fabric and HSS are programmed with FlashPro or Libero through the embedded FlashPro6 on a second micro-USB connector; wrap those tools in a FlashScriptDriver.
    docs:
      - title: MPFS-ICICLE-KIT-ES
        url: https://www.microchip.com/en-us/development-tool/mpfs-icicle-kit-es

  # ---------------------------------------------------------------- MCU kits
  - id: nordic-nrf52840-dk
    name: Nordic nRF52840 DK
    vendor: Nordic Semiconductor
    family: nrf52
    openocd: nordic/nrf52-dk
    curation: docs
    console:
      interface: cdc-acm
      chip: jlink
      note: The on-board SEGGER J-Link OB (1366:1015) exposes a CDC ACM port wired to the nRF52840 UART (/dev/ttyACM*). That id is not in Labgrid's USBDebugger match list at v26.0-281, so use the console as a USBSerialPort and run OpenOCD or nrfjprog from a script.
    power:
      inputs: [micro-usb]
      note: Powered from the J-Link micro-USB connector (or a coin cell); a YKUSH or switchable hub port can power-cycle it.
    flashing: [openocd]
    bootloader:
      kind: none
      note: OpenOCD uses interface/jlink.cfg with target/nordic/nrf52.cfg (board/nordic/nrf52-dk.cfg); nrfjprog and pyOCD are alternatives.
    tags: [cortex-m, mcu, ble, evk]
    docs:
      - title: nRF52840 DK
        url: https://www.nordicsemi.com/Products/Development-hardware/nRF52840-DK
  - id: espressif-esp32-s3-devkitc-1
    name: Espressif ESP32-S3-DevKitC-1
    vendor: Espressif
    family: esp32
    openocd: esp32s3-builtin
    curation: docs
    console:
      interface: onboard-usb
      chip: cp210x
      note: Two micro-USB connectors; the UART port has a CP2102N bridge (10c4:ea60, /dev/ttyUSB*) and the USB port is the chip's built-in USB Serial/JTAG (303a:1001, /dev/ttyACM*), which OpenOCD uses through board/esp32s3-builtin.cfg.
    power:
      inputs: [micro-usb]
      note: 5 V over either micro-USB connector; a YKUSH or switchable hub port can power-cycle it.
    flashing: [openocd]
    bootloader:
      kind: none
      note: Flashing normally uses esptool over the UART port through the automatic boot-mode circuit; wrap it in a FlashScriptDriver. OpenOCD over the built-in USB JTAG is the alternative.
    tags: [mcu, wifi, evk]
    docs:
      - title: ESP32-S3-DevKitC-1 user guide
        url: https://docs.espressif.com/projects/esp-idf/en/latest/esp32s3/hw-reference/esp32s3/user-guide-devkitc-1.html
