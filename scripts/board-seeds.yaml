# Seeds for scripts/import-board-candidates.mjs.
#
# Each seed names a board and points at the files in the local source trees
# that describe it. The script extracts facts (U-Boot prompt and baud rate,
# Linux console UART, OpenOCD probe) and merges them with the hand-written
# fields below, which win over derived values. `curation` is ignored by the
# script; it records the verification level the curator intends to set after
# checking the documentation linked in `docs` (unverified when only the trees
# were consulted).
#
# Pointers: uboot = configs/<uboot>_defconfig, dts = arch/*/boot/dts/<dts>.dts
# (defaults to CONFIG_DEFAULT_DEVICE_TREE), buildroot = configs/<buildroot>_defconfig,
# openocd = tcl/board/<openocd>.cfg, openocdTarget = tcl/target/<name>.cfg.
schemaVersion: 1
seeds:
  # ---------------------------------------------------------------- ST
  - id: stm32-nucleo-144
    name: STM32 Nucleo-144 (any variant)
    vendor: STMicroelectronics
    family: stm32
    openocd: st_nucleo_f7
    curation: docs
    console:
      interface: cdc-acm
      chip: stlink
      note: The on-board ST-LINK/V2-1 or STLINK-V3E exposes a virtual COM port wired to the target UART (/dev/ttyACM*), so one USB cable gives console and debugger.
    power:
      inputs: [micro-usb, usb-c]
      note: Powered from the ST-LINK USB connector by default; a YKUSH or switchable hub port can power-cycle it. Jumpers select external 5 V or VIN instead.
    flashing: [openocd]
    tags: [cortex-m, mcu, evk]
    notes:
      - OpenOCD scripts live under board/st_nucleo_*.cfg (f7, h743zi, h745zi, l4 and others); pick the one matching your MCU family.
    docs:
      - title: STM32 Nucleo boards
        url: https://www.st.com/en/evaluation-tools/stm32-nucleo-boards.html
  - id: stm32f4-discovery
    name: STM32F4DISCOVERY / STM32F407G-DISC1
    vendor: STMicroelectronics
    family: stm32
    openocd: stm32f4discovery
    curation: docs
    console:
      interface: cdc-acm
      chip: stlink
      note: The STM32F407G-DISC1 revision has an ST-LINK/V2-A with a virtual COM port; the original STM32F4DISCOVERY ST-LINK/V2 has no VCP, so wire a 3.3 V USB-UART adapter to the UART pins on that revision.
    power:
      inputs: [other]
      note: 5 V over the ST-LINK mini-USB connector (CN1); a switchable hub port or YKUSH can power-cycle it.
    flashing: [openocd]
    tags: [cortex-m, mcu, evk]
    docs:
      - title: STM32F4DISCOVERY
        url: https://www.st.com/en/evaluation-tools/stm32f4discovery.html
  - id: stm32f746g-disco
    name: STM32F746G-DISCO Discovery kit
    vendor: STMicroelectronics
    family: stm32
    openocd: stm32f746g-disco
    curation: docs
    console:
      interface: cdc-acm
      chip: stlink
      note: The on-board ST-LINK/V2-1 provides a virtual COM port on the ST-LINK mini-USB connector (/dev/ttyACM*).
    power:
      inputs: [other]
      note: 5 V over the ST-LINK mini-USB connector or the USB OTG connectors, selected with the power jumper; a switchable hub port or YKUSH can power-cycle it.
    flashing: [openocd]
    tags: [cortex-m, mcu, evk]
    docs:
      - title: STM32F746G-DISCO
        url: https://www.st.com/en/evaluation-tools/32f746gdiscovery.html
  - id: stm32mp135f-dk
    name: STM32MP135F-DK Discovery kit
    vendor: STMicroelectronics
    family: stm32mp
    uboot: stm32mp13
    buildroot: stm32mp135f_dk
    curation: docs
    console:
      interface: onboard-usb
      chip: stlink
      note: The on-board STLINK-V3E provides the console as a CDC ACM port (/dev/ttyACM*) and a debugger on the same USB cable.
    power:
      inputs: [usb-c]
      note: 5 V / 3 A over the dedicated USB-C power connector.
    flashing: [sd-card, dfu]
    tags: [arm, linux, evk]
    notes:
      - Setting the boot switches to USB boot exposes the ROM code as DFU device 0483:df11 for STM32CubeProgrammer.
    docs:
      - title: STM32MP135F-DK
        url: https://www.st.com/en/evaluation-tools/stm32mp135f-dk.html
  - id: stm32mp157d-dk1
    name: STM32MP157D-DK1 Discovery kit
    vendor: STMicroelectronics
    family: stm32mp
    uboot: stm32mp15
    dts: st/stm32mp157a-dk1
    buildroot: stm32mp157a_dk1
    curation: docs
    console:
      interface: onboard-usb
      chip: stlink
      note: The on-board ST-LINK/V2-1 provides the console as a CDC ACM port (/dev/ttyACM*) and a debugger on the same micro-USB cable.
    power:
      inputs: [usb-c]
      note: 5 V / 3 A over the dedicated USB-C power connector.
    flashing: [sd-card, dfu]
    tags: [arm, linux, evk]
    notes:
      - The kernel device tree is shared with the STM32MP157A-DK1; the D revision only changes the SoC speed grade.
      - Setting the boot switches to USB boot exposes the ROM code as DFU device 0483:df11 for STM32CubeProgrammer.
    docs:
      - title: STM32MP157D-DK1
        url: https://www.st.com/en/evaluation-tools/stm32mp157d-dk1.html

  # ---------------------------------------------------------------- NXP
  - id: nxp-imx8mp-evk
    name: NXP i.MX 8M Plus EVK
    vendor: NXP
    family: imx
    uboot: imx8mp_evk
    buildroot: imx8mp-evk
    openocd: nxp_imx8mp-evk
    curation: docs
    console:
      interface: onboard-usb
      chip: ftdi
      note: The debug micro-USB connector carries a multi-channel FTDI bridge that appears as several ttyUSB ports; the Cortex-A console is usually the third one (ID_USB_INTERFACE_NUM '02') and the Cortex-M7 console the fourth. Verify with the quick start guide and pin the match.
    power:
      inputs: [usb-c]
      note: USB-C power-delivery supply (the kit ships a 65 W adapter); switch the mains adapter or use a PD-capable switched outlet.
    flashing: [sd-card, uuu]
    tags: [arm64, linux, evk]
    notes:
      - Serial download mode (boot switches) exposes the SoC as 1fc9:0146 for UUUDriver bootstrap.
      - OpenOCD has board/nxp_imx8mp-evk.cfg for the Cortex-A cores over an external JTAG probe.
    docs:
      - title: 8MPLUSLPD4-EVK
        url: https://www.nxp.com/design/design-center/development-boards-and-designs/i-mx-evaluation-and-development-boards/evaluation-kit-for-the-i-mx-8m-plus-applications-processor:8MPLUSLPD4-EVK
  - id: nxp-imx8mn-evk
    name: NXP i.MX 8M Nano EVK
    vendor: NXP
    family: imx
    uboot: imx8mn_ddr4_evk
    buildroot: imx8mn-ddr4-evk
    curation: unverified
    console:
      interface: onboard-usb
      note: The debug micro-USB connector carries a two-channel USB-UART bridge; the Cortex-A console is typically the second ttyUSB port like on the i.MX 8M Mini EVK. Confirm the bridge model and channel with the quick start guide.
    power:
      inputs: [usb-c]
      note: USB-C power-delivery supply; switch the mains adapter.
    flashing: [sd-card, uuu]
    tags: [arm64, linux, evk]
    notes:
      - Serial download mode exposes the SoC as 1fc9:013e for UUUDriver bootstrap.
      - U-Boot has separate defconfigs for the DDR4 (imx8mn_ddr4_evk) and LPDDR4 (imx8mn_evk) board variants.
  - id: nxp-imx6ull-evk
    name: NXP i.MX 6ULL 14x14 EVK
    vendor: NXP
    family: imx
    uboot: mx6ull_14x14_evk
    buildroot: imx6ullevk
    curation: unverified
    console:
      interface: onboard-usb
      note: The debug micro-USB connector on the base board carries a USB-UART bridge (one ttyUSB port). Confirm the bridge model for your board revision.
    power:
      inputs: [other]
      note: 5 V supply; check the base board for the power connector (USB or jack) on your revision.
    flashing: [sd-card, uuu]
    tags: [arm, linux, evk]
    notes:
      - Serial download mode exposes the SoC as 15a2:0080 for UUUDriver bootstrap.
  - id: nxp-imx95-evk
    name: NXP i.MX 95 19x19 EVK
    vendor: NXP
    family: imx
    uboot: imx95_19x19_evk
    dts: freescale/imx95-19x19-evk
    curation: unverified
    console:
      interface: onboard-usb
      note: Debug USB connector with a multi-channel bridge; confirm the Cortex-A console channel with the quick start guide and pin it with ID_USB_INTERFACE_NUM.
    power:
      inputs: [other]
      note: Confirm the supply (USB-C PD or DC jack) in the quick start guide; switch the mains adapter.
    flashing: [sd-card, uuu]
    tags: [arm64, linux, evk]
  - id: nxp-frdm-k64f
    name: NXP FRDM-K64F
    vendor: NXP
    family: kinetis
    openocd: nxp_frdm-k64f
    curation: docs
    console:
      interface: cdc-acm
      chip: daplink
      note: The OpenSDA circuit runs DAPLink (CMSIS-DAP, 0d28:0204) and exposes the console as /dev/ttyACM*. The console works as a USBSerialPort; Labgrid's USBDebugger does not match DAPLink at v26.0-281.
    power:
      inputs: [micro-usb]
      note: Powered from the OpenSDA micro-USB connector; a YKUSH or switchable hub port can power-cycle it.
    flashing: [openocd]
    bootloader:
      kind: none
      note: Use interface/cmsis-dap.cfg via board/nxp_frdm-k64f.cfg; DAPLink also offers drag-and-drop mass-storage flashing. Because Labgrid's USBDebugger does not match DAPLink today, run OpenOCD from a FlashScriptDriver or extend the whitelist upstream.
    tags: [cortex-m, mcu, evk]
    docs:
      - title: FRDM-K64F
        url: https://www.nxp.com/design/design-center/development-boards-and-designs/general-purpose-mcus/freedom-development-platform-for-kinetis-k64-k63-and-k24-mcus:FRDM-K64F

