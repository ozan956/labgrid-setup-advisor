    power:
      inputs: [other]
      note: Confirm the DC supply in the user guide; switch the mains adapter with a PDU.
    flashing: [sd-card]
    tags: [arm64, linux, evk]
    docs:
      - title: SK-AM69
        url: https://www.ti.com/tool/SK-AM69

  # ---------------------------------------------------------------- AMD / Xilinx
  - id: amd-zcu104
