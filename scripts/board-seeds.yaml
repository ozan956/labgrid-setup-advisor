      - title: ZCU104 evaluation kit
        url: https://www.xilinx.com/products/boards-and-kits/zcu104.html
  - id: amd-zcu106
    name: AMD/Xilinx ZCU106 evaluation kit
    vendor: AMD (Xilinx)
    family: zynqmp
    uboot: xilinx_zynqmp_virt
    dts: xilinx/zynqmp-zcu106-revA
    buildroot: zynqmp_zcu106
    curation: docs
    console:
      interface: onboard-usb
      chip: cp210x
      note: The USB-UART connector carries a Silicon Labs CP2108 quad bridge (four ttyUSB ports); the PS UART0 console is one of them, so test each and pin it with ID_USB_INTERFACE_NUM.
    power:
      inputs: [other]
      note: 12 V supply with a 6-pin connector; switch the mains adapter with a PDU.
    flashing: [sd-card, jtag-vendor]
